upstream qms_frontend { server frontend:3000; }
upstream qms_backend { server backend:8000; }
server {
    listen 80;
    client_max_body_size 20m;
    location /api/ { proxy_pass http://qms_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { proxy_pass http://qms_frontend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
