services:
  qa-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${QA_POSTGRES_BIND_IP:-127.0.0.1}:${QA_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - qa-postgres-data:/var/lib/postgresql/data
    networks: [qa-system-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6

  qa-backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    networks: [qa-system-network]
    volumes:
      - qa-backend-storage:/var/www/html/storage
    depends_on:
      qa-postgres:
        condition: service_healthy

  qa-backend-web:
    build:
      context: .
      dockerfile: nginx/backend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QA_BACKEND_PORT:-13001}:80"
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - qa-system-network
      - rapidplast-network
    depends_on:
      qa-backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  qa-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BASE_PATH: /qa-system
        NEXT_PUBLIC_API_URL: /qa-system/api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${QA_FRONTEND_PORT:-13000}:3000"
    networks:
      - qa-system-network
      - rapidplast-network
    depends_on:
      qa-backend-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$(hostname):3000/qa-system"]
      interval: 15s
      timeout: 5s
      retries: 5

  qa-queue:
    image: qa-system-qa-backend:latest
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    env_file: ./backend/.env
    networks: [qa-system-network]
    volumes:
      - qa-backend-storage:/var/www/html/storage
    depends_on:
      qa-backend:
        condition: service_started

  qa-scheduler:
    image: qa-system-qa-backend:latest
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: ./backend/.env
    networks: [qa-system-network]
    volumes:
      - qa-backend-storage:/var/www/html/storage
    depends_on:
      qa-backend:
        condition: service_started

networks:
  qa-system-network:
    name: qa-system-network
  rapidplast-network:
    external: true
    name: rapidplast-network

volumes:
  qa-postgres-data:
    name: qa-postgres-data
  qa-backend-storage:
    name: qa-backend-storage