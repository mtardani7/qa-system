services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-qms}
      POSTGRES_USER: ${DB_USERNAME:-qms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [qms-postgres:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qms} -d ${DB_DATABASE:-qms}"], interval: 10s, timeout: 5s, retries: 5 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [qms-redis:/data]
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    volumes: [qms-storage:/var/www/html/storage]
  queue:
    build: ./backend
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120
    env_file: ./backend/.env
    depends_on: { backend: { condition: service_started }, redis: { condition: service_started } }
  scheduler:
    build: ./backend
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: ./backend/.env
    depends_on: { backend: { condition: service_started } }
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment: { NODE_ENV: production }
    depends_on: { backend: { condition: service_started } }
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: { frontend: { condition: service_started }, backend: { condition: service_started } }
volumes: { qms-postgres: {}, qms-redis: {}, qms-storage: {} }
